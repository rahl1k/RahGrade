<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RahGrade</title>
<style>
:root{--bg:#0b0d11;--panel:#121720;--line:#2a313d;--gold:#ffc226;--txt:#f5f7fb;--muted:#9aa6b8;--green:#2ae082;--red:#ff5f68}
*{box-sizing:border-box}body{margin:0;background:#090c11;color:var(--txt);font-family:Inter,Arial,sans-serif}button,input{font:inherit}
.top{height:76px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);background:#0d1117;position:sticky;top:0;z-index:10}.logo{font-size:22px;font-weight:1000}.logo b{color:var(--gold)}.balance{margin-left:auto;color:var(--gold);font-size:18px;font-weight:1000;border:1px solid #303846;padding:12px 16px;border-radius:16px}
.wrap{max-width:1320px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#141a23;border:1px solid var(--line);color:#c6cfdd;padding:10px 16px;border-radius:11px;font-weight:900}.tab.on{background:var(--gold);color:#111}
.panel{background:linear-gradient(#151b24,#10151c);border:1px solid var(--line);border-radius:20px;padding:18px}.hidden{display:none!important}
.upgrade{display:grid;grid-template-columns:1fr 280px 1fr;gap:18px}.card{min-height:330px;border:1px solid #343d4b;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;background:radial-gradient(circle at 50% 30%,#202b3c,#121820 60%)}
.skin{width:92%;height:150px;object-fit:contain;filter:drop-shadow(0 12px 20px #000a)}.fallback{height:150px;width:92%;display:grid;place-items:center;color:#8995a8;font-weight:900}.nm{font-weight:900;margin-top:10px}.pr{color:var(--gold);font-size:23px;font-weight:1000;margin-top:6px}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center}.dial{width:220px;height:220px;position:relative}.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--gold) calc(var(--chance)*1%),#2b313b 0);box-shadow:0 0 30px #ffc22622}.ring:after{content:"";position:absolute;inset:22px;border-radius:50%;background:#11161d}
.chanceText{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2}.chanceText strong{font-size:36px;color:var(--gold)}.chanceText small{color:var(--green);font-weight:900;margin-top:6px}
.pointer{position:absolute;inset:0;z-index:4;transform:rotate(0deg);pointer-events:none}.pointer:before{content:"";position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:27px solid var(--gold);filter:drop-shadow(0 0 7px #ffc226aa)}.pointer:after{content:"";position:absolute;left:50%;top:12px;transform:translateX(-50%);width:6px;height:25px;border-radius:5px;background:var(--gold)}.pointer.spin{transition:transform 4s cubic-bezier(.08,.62,.08,1)}
.mults{display:flex;gap:8px;margin-top:16px}.mult{background:#171d26;border:1px solid var(--line);color:#b9c3d2;border-radius:10px;padding:9px 13px;font-weight:1000}.mult.on{color:var(--gold);border-color:var(--gold)}.status{height:22px;margin-top:8px;font-weight:1000}.go{margin-top:8px;width:220px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#ffc226,#ff9d00);font-weight:1000;font-size:18px}.go:disabled{opacity:.35}
.shopgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-height:600px;overflow:auto}.item{background:#121820;border:1px solid var(--line);border-radius:14px;padding:12px}.mini{width:100%;height:100px;object-fit:contain;background:transparent}.item .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .pr{font-size:16px}.actions{display:flex;gap:7px;margin-top:9px}.small{flex:1;background:#1b222d;border:1px solid var(--line);color:white;border-radius:9px;padding:8px;font-weight:900}.buy{background:#6e5707}.sell{background:#37202a}
.search{width:100%;background:#0d1218;border:1px solid var(--line);color:white;padding:12px;border-radius:10px;margin-bottom:12px}.row{display:grid;grid-template-columns:90px 1fr 70px 70px;gap:8px;padding:10px;border-bottom:1px solid var(--line);font-size:13px}.win{color:var(--green);font-weight:1000}.lose{color:var(--red);font-weight:1000}
.overlay{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:30;backdrop-filter:blur(6px)}.result{width:min(420px,90vw);padding:28px;border-radius:20px;background:#121820;border:1px solid #323a46;text-align:center}.result h1{font-size:44px;margin:0 0 10px}.result button{margin-top:18px;background:var(--gold);border:0;border-radius:11px;padding:11px 18px;font-weight:1000}
@media(max-width:900px){.upgrade{grid-template-columns:1fr}.shopgrid{grid-template-columns:repeat(2,1fr)}.top{padding:0 14px}.wrap{padding:12px}}
</style></head><body>
<div class="top"><div class="logo"><b>RAH</b>GRADE</div><div class="balance">БАЛАНС: <span id="bal">5000.00</span> G</div></div>
<div class="wrap"><div class="tabs"><button class="tab on" data-tab="upgrade">АПГРЕЙД</button><button class="tab" data-tab="shop">МАГАЗИН</button><button class="tab" data-tab="inventory">ИНВЕНТАРЬ</button><button class="tab" data-tab="history">ИСТОРИЯ</button></div>
<section id="upgrade" class="view"><div class="panel upgrade">
<div class="card"><div id="fromV"></div><div class="nm" id="fromN">Выбери скин из инвентаря</div><div class="pr" id="fromP">—</div></div>
<div class="mid"><div class="dial"><div class="ring" id="ring" style="--chance:50"></div><div class="chanceText"><strong id="chance">50.00%</strong><small id="chanceLabel">СРЕДНИЙ ШАНС</small></div><div class="pointer" id="pointer"></div></div>
<div class="mults"><button class="mult on" data-m="2">X2</button><button class="mult" data-m="4">X4</button><button class="mult" data-m="8">X8</button><button class="mult" data-m="1.333333">75%</button></div><div class="status" id="status"></div><button class="go" id="go" disabled>ПРОКАЧАТЬ</button></div>
<div class="card"><div id="toV"></div><div class="nm" id="toN">Цель появится здесь</div><div class="pr" id="toP">—</div></div>
</div></section>
<section id="shop" class="view hidden"><div class="panel"><input id="shopSearch" class="search" placeholder="Поиск..."><div id="shopGrid" class="shopgrid"></div></div></section>
<section id="inventory" class="view hidden"><div class="panel"><input id="invSearch" class="search" placeholder="Поиск..."><div id="invGrid" class="shopgrid"></div></div></section>
<section id="history" class="view hidden"><div class="panel"><div id="historyList"></div></div></section></div>
<div id="overlay" class="overlay hidden"><div class="result"><h1 id="resTitle"></h1><div id="resText"></div><button id="resBtn">ПРОДОЛЖИТЬ</button></div></div>
<script>
const RAW=[["TEC-9", "Dalmatian", 2], ["USP", "Line", 2.24], ["USP", "Ray", 5.1], ["P350", "Nano", 5.09], ["G22", "Yellow Line", 5.4], ["MP7", "Banana", 6.5], ["G22", "Carbon", 6.9], ["UMP45", "Geometric", 7.4], ["F/S", "Wraith", 11.98], ["P350", "Autumn", 12.38], ["UMP45", "Spirit", 16.99], ["AKR", "Nano", 17.29], ["M4", "Lizard", 29], ["MP7", "Lich", 31], ["MP7", "Revival", 51], ["G22", "Carbon StatTrack", 64], ["MP7", "Graffiti", 82], ["UMP45", "Spirit StatTrack", 85.5], ["F/S", "Wraith StatTrack", 87.97], ["AKR", "Carbon", 90], ["F/S", "Rush", 95], ["AKR12", "Pixel Camouflage", 95.7], ["F/S", "Venom", 99], ["P350", "Autumn StatTrack", 100], ["AKR", "Sport", 116], ["M4", "Samurai", 130], ["P90", "Samurai", 175], ["AKR12", "Geometric", 200], ["FabM", "Reactor StatTrack", 245.97], ["MP7", "Revival StatTrack", 290], ["AKR", "Necromancer", 310], ["MP7", "Graffiti StatTrack", 312.99], ["F/S", "Rush StatTrack", 319], ["AKR", "Dragon", 430], ["MP5", "Project Z9 StatTrack", 489.9], ["P90", "Samurai StatTrack", 736.99], ["AKR12", "Geometric StatTrack", 1073], ["UMP45", "White Carbon StatTrack", 1100], ["AKR12", "Railgun", 1308.88], ["Kunai", "Reaper", 1700], ["Kunai", "Radiation", 1910], ["AKR", "Dragon StatTrack", 2266.43], ["MP5", "Reactor StatTrack", 2869], ["USP", "Geometric", 3050], ["M4", "Necromancer", 4799], ["M16", "Winged", 4990], ["M4A1", "Immortal", 5500], ["M9 Bayonet", "Twilight", 5800], ["M9 Bayonet", "Ancient", 5900], ["AKR12", "Railgun Premium", 6100], ["M9 Bayonet", "Sketch", 6500], ["M9 Bayonet", "Kumo", 6700], ["M9 Bayonet", "Poison", 6990], ["AWM", "Winter Sport", 7240], ["Karambit", "Claw", 7700], ["AWM", "2 Years Red", 7900], ["AKR", "Treasure Hunter", 8298], ["M9 Bayonet", "Frozen", 8800], ["M9 Bayonet", "Blue Blood", 9500], ["Flip", "Stone Cold", 10000], ["AKR12", "Riot", 11777], ["USP", "Geometric Premium", 12190], ["MP5", "Zone", 12900], ["M4A1", "Paladin", 14900], ["FAMAS", "Monster", 15050], ["M9 Bayonet", "Scratch", 15400], ["MP5", "Zone StatTrack", 16000], ["M9 Bayonet", "Universe", 16500], ["Origin", "Case", 18700], ["Charm", "Ochpochmak", 19750], ["AKR", "2 Years Red", 20563], ["P350", "Radiation", 26999], ["M9 Bayonet", "Dragon Glass", 31000], ["FAMAS", "Monster StatTrack", 36000], ["FN FAL", "Leather", 36396], ["AKR", "Digital Burst", 42000], ["AWM", "Sport V2", 44444], ["AWM", "Winter Sport StatTrack", 67500], ["Dual Daggers", "Harmony", 71100], ["Desert Eagle", "Aureate", 89777], ["AWM", "Treasure Hunter", 89888], ["Sting", "Mimicry", 105900], ["M40", "Monster StatTrack", 139000], ["Karambit", "Gold", 144999], ["Sticker", "Punisher", 149997], ["Flash", "Solar", 150000], ["Sticker", "Snow Queen", 150000], ["Sticker", "Z9 Mask Color", 199999], ["Sticker", "Metal Rat", 266650], ["Butterfly", "Arcane Surge", 344444], ["Sticker", "Gold Skull", 399000], ["Sticker", "Devilish", 449999], ["Butterfly", "Twilight", 777778], ["AKR12", "Year of the Horse StatTrack", 999998]];
const C=RAW.map((x,i)=>({id:'x'+i,weapon:x[0],name:x[1],price:+x[2]}));
const key='rahgrade_v1';let s=JSON.parse(localStorage.getItem(key)||'null')||{balance:5000,inventory:[],history:[],nextId:1};if(!s.nextId)s.nextId=1;
let selected=null,mult=2,target=null,busy=false,currentAngle=0;
const fmt=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
function cleanName(x){let n=(x.name||'').replace(/ StatTrack$/,'').replace(/ Premium$/,'');return (x.weapon+' '+n).trim()}
function catalogItem(x){return C.find(v=>cleanName(v)===cleanName(x))||null}for(const item of s.inventory){const c=catalogItem(item);if(c)item.price=c.price}localStorage.setItem(key,JSON.stringify(s));
function iconUrls(x){const n=cleanName(x);if(n==='Butterfly Twilight')return ['butterfly_twilight_hq.png'];if(n==='AKR12 Year of the Horse')return ['https://standoffhub.pro/images/items/AKR12%20S2%20Year%20of%20the%20Horse.png','https://standoffhub.pro/images/items/AKR12%20S1%20Year%20of%20the%20Horse.png','https://standoffhub.pro/images/items/AKR12%20S3%20Year%20of%20the%20Horse.png'];const iconName=n.replace(/^F\/S\b/,'FS');return ['https://standoffhub.pro/images/items/'+encodeURIComponent(iconName)+'.png']}
function img(x,cls='skin'){if(!x)return '<div class=fallback>?</div>';const urls=iconUrls(x);return `<img class="${cls}" src="${urls[0]}" data-fallbacks="${urls.slice(1).join('|')}" alt="${cleanName(x)}" onerror="const a=(this.dataset.fallbacks||'').split('|').filter(Boolean);if(a.length){this.src=a.shift();this.dataset.fallbacks=a.join('|')}">`}
function save(){localStorage.setItem(key,JSON.stringify(s));renderAll()}
function chanceVal(){return mult===1.333333?75:mult===2?50:mult===4?25:12.5}
function chooseTarget(){if(!selected)return null;let want=selected.price*mult;let pool=C.filter(x=>cleanName(x)!==cleanName(selected));pool.sort((a,b)=>Math.abs(a.price-want)-Math.abs(b.price-want));let near=pool.slice(0,Math.min(12,pool.length));return near[Math.floor(Math.random()*near.length)]||pool[0]}
function renderUpgrade(){let c=chanceVal();ring.style.setProperty('--chance',c);chance.textContent=c.toFixed(2)+'%';chanceLabel.textContent=c>=70?'ВЫСОКИЙ ШАНС':c>=35?'СРЕДНИЙ ШАНС':'НИЗКИЙ ШАНС';fromV.innerHTML=img(selected);fromN.textContent=selected?cleanName(selected):'Выбери скин из инвентаря';fromP.textContent=selected?fmt(selected.price)+' G':'—';if(selected&&!target)target=chooseTarget();toV.innerHTML=img(target);toN.textContent=target?cleanName(target):'Цель появится здесь';toP.textContent=target?fmt(target.price)+' G':'—';go.disabled=!selected||busy;document.querySelectorAll('.mult').forEach(b=>b.disabled=busy)}
function renderShop(){let q=(shopSearch.value||'').toLowerCase();shopGrid.innerHTML=C.filter(x=>cleanName(x).toLowerCase().includes(q)).sort((a,b)=>a.price-b.price).map(x=>`<div class=item>${img(x,'mini')}<div class=nm>${cleanName(x)}</div><div class=pr>${fmt(x.price)} G</div><div class=actions><button class="small buy" onclick="buy('${x.id}')">Купить</button></div></div>`).join('')}
function renderInv(){let q=(invSearch.value||'').toLowerCase();let a=s.inventory.filter(x=>cleanName(x).toLowerCase().includes(q));invGrid.innerHTML=a.length?a.map(x=>`<div class=item>${img(x,'mini')}<div class=nm>${cleanName(x)}</div><div class=pr>${fmt(x.price)} G</div><div class=actions><button class=small onclick="pick('${x.uid}')">В апгрейд</button><button class="small sell" onclick="sell('${x.uid}')">Продать</button></div></div>`).join(''):'Инвентарь пуст'}
function renderHistory(){historyList.innerHTML=s.history.slice().reverse().map(h=>`<div class=row><span>${h.time}</span><span>${h.from} → ${h.to}</span><span>${h.c}%</span><span class="${h.w?'win':'lose'}">${h.w?'WIN':'LOSE'}</span></div>`).join('')}
function renderAll(){bal.textContent=Number(s.balance).toFixed(2);renderShop();renderInv();renderHistory();renderUpgrade()}
window.buy=id=>{let x=C.find(v=>v.id===id);if(!x||s.balance<x.price)return;s.balance-=x.price;s.inventory.push({...x,uid:'i'+s.nextId++});save()};
window.sell=uid=>{let i=s.inventory.findIndex(x=>x.uid===uid);if(i<0)return;let x=s.inventory[i];s.balance+=x.price;s.inventory.splice(i,1);if(selected?.uid===uid){selected=null;target=null}save()};
window.pick=uid=>{selected=s.inventory.find(x=>x.uid===uid)||null;target=chooseTarget();show('upgrade');renderAll()};
document.querySelectorAll('.mult').forEach(b=>b.onclick=()=>{if(busy)return;document.querySelectorAll('.mult').forEach(x=>x.classList.remove('on'));b.classList.add('on');mult=+b.dataset.m;target=chooseTarget();renderUpgrade()});
go.onclick=()=>{if(!selected||!target||busy)return;busy=true;renderUpgrade();let c=chanceVal(),finalDeg=Math.random()*360,winArc=c*3.6,win=finalDeg<winArc;let delta=((finalDeg-currentAngle)%360+360)%360;let targetAngle=currentAngle+6*360+delta;pointer.classList.remove('spin');void pointer.offsetWidth;pointer.classList.add('spin');pointer.style.transform=`rotate(${targetAngle}deg)`;status.textContent='КРУТИМ...';go.textContent='ПРОКРУТКА';setTimeout(()=>finish(win,c,targetAngle),4000)};
function finish(win,c,targetAngle){let f=selected,t={...target};let i=s.inventory.findIndex(x=>x.uid===f.uid);if(i>=0)s.inventory.splice(i,1);if(win){let won={...t,price:t.price,uid:'i'+s.nextId++};s.inventory.push(won);resTitle.textContent='WIN!';resTitle.className='win';resText.textContent='Выпал '+cleanName(won)+' за '+fmt(won.price)+' G';status.textContent='WIN!'}else{resTitle.textContent='LOSE';resTitle.className='lose';resText.textContent='Скин сгорел';status.textContent='LOSE'}s.history.push({time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),from:cleanName(f),to:win?cleanName(t):'СЛИВ',c,w:win});selected=null;target=null;busy=false;go.textContent='ПРОКАЧАТЬ';save();overlay.classList.remove('hidden');setTimeout(()=>{pointer.classList.remove('spin');pointer.style.transform='rotate(0deg)';currentAngle=0},120)}
resBtn.onclick=()=>{overlay.classList.add('hidden');status.textContent='';pointer.classList.remove('spin');pointer.style.transform='rotate(0deg)';currentAngle=0;renderUpgrade()};
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===id))}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.tab));shopSearch.oninput=renderShop;invSearch.oninput=renderInv;renderAll();
</script></body></html>
