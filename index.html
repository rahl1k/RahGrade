<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RahGrade</title>
<style>:root{--bg:#0b0d11;--panel:#11151b;--line:#252c36;--txt:#f5f7fb;--muted:#8d98aa;--gold:#ffc226;--gold2:#ff9d00;--good:#2ae082;--bad:#ff5f68}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#27200d 0,transparent 34%),var(--bg);font-family:Inter,Arial,sans-serif;color:var(--txt);min-height:100vh}button,input{font:inherit}.top{height:72px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line);background:#0c0f14dd;position:sticky;top:0;z-index:20;backdrop-filter:blur(16px)}.logo{font-size:21px;font-weight:900}.logo b{color:var(--gold)}.balance{margin-left:auto;background:#171b20;border:1px solid #2a3039;border-radius:16px;padding:10px 15px;font-weight:900;color:var(--gold);font-size:18px}.wrap{max-width:1380px;margin:auto;padding:20px}.tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#12161c;color:#bac3d1;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:800}.tab.on{background:var(--gold);color:#111;border-color:var(--gold)}.panel{background:linear-gradient(180deg,#151a22,#10141a);border:1px solid var(--line);border-radius:20px;padding:18px}.upgrade{display:grid;grid-template-columns:1fr 260px 1fr;gap:18px}.cardbig{min-height:300px;border:1px solid #323a47;border-radius:18px;background:radial-gradient(circle at 50% 30%,#263147 0,transparent 55%),#131821;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.weapon{width:190px;height:90px;border-radius:16px;background:linear-gradient(135deg,#2a3342,#151a22);display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:24px;letter-spacing:2px;margin-bottom:18px}.name{font-weight:900}.price{margin-top:8px;color:var(--gold);font-size:24px;font-weight:1000}.mid{display:flex;flex-direction:column;align-items:center;justify-content:center}.chanceRing{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--chance)*1%),#2b313b 0);position:relative}.chanceRing:after{content:"";position:absolute;inset:18px;border-radius:50%;background:#11161d}.chanceTxt{z-index:2;text-align:center}.chanceTxt strong{font-size:36px;color:var(--gold)}.chanceTxt small{display:block;color:var(--good);font-weight:900;margin-top:5px}.go{margin-top:16px;width:210px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));padding:15px;font-weight:1000;font-size:18px;cursor:pointer}.go:disabled{opacity:.35}.mults{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}.mult{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:#171c24;color:#b9c2cf;cursor:pointer;font-weight:900}.mult.on{border-color:var(--gold);color:var(--gold)}.toolbar{display:flex;gap:10px;margin-bottom:14px}.search{flex:1;background:#0d1117;border:1px solid var(--line);color:white;padding:12px 14px;border-radius:12px}.shopgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-height:520px;overflow:auto}.item{background:#131820;border:1px solid var(--line);border-radius:14px;padding:12px}.miniweapon{height:78px;border-radius:10px;background:linear-gradient(135deg,#252e3b,#171c24);display:flex;align-items:center;justify-content:center;font-weight:1000}.item .nm{font-size:13px;font-weight:900;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .pr{color:var(--gold);font-weight:1000;margin-top:5px}.actions{display:flex;gap:8px;margin-top:8px}.small{flex:1;border:1px solid var(--line);background:#1a2029;color:white;border-radius:8px;padding:7px;cursor:pointer;font-size:12px;font-weight:800}.small.buy{background:#5d4a08}.small.sell{background:#33202a}.history{max-height:520px;overflow:auto}.row{display:grid;grid-template-columns:120px 1fr 90px 90px;gap:10px;padding:11px;border-bottom:1px solid var(--line);font-size:13px}.win{color:var(--good);font-weight:900}.lose{color:var(--bad);font-weight:900}.note{color:var(--muted);font-size:12px;margin-top:10px}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#171c24;border:1px solid var(--line);padding:14px 16px;border-radius:12px;z-index:50}@media(max-width:900px){.upgrade{grid-template-columns:1fr}.shopgrid{grid-template-columns:repeat(2,1fr)}.top{padding:0 12px}.wrap{padding:12px}}</style></head>
<body><div class="top"><div class="logo"><b>RAH</b>GRADE</div><div class="balance">БАЛАНС: <span id="bal">5000.00</span> G</div></div><div class="wrap"><div class="tabs"><button class="tab on" data-tab="upgrade">АПГРЕЙД</button><button class="tab" data-tab="shop">МАГАЗИН</button><button class="tab" data-tab="inventory">ИНВЕНТАРЬ</button><button class="tab" data-tab="history">ИСТОРИЯ</button></div><section id="upgrade" class="view"><div class="panel upgrade"><div class="cardbig"><div class="weapon" id="fromWeapon">?</div><div class="name" id="fromName">Выбери скин из инвентаря</div><div class="price" id="fromPrice">—</div></div><div class="mid"><div class="chanceRing" id="ring" style="--chance:50"><div class="chanceTxt"><strong id="chance">50.00%</strong><small id="chanceLabel">ВЫСОКИЙ ШАНС</small></div></div><div class="mults"><button class="mult on" data-m="2">X2</button><button class="mult" data-m="4">X4</button><button class="mult" data-m="8">X8</button><button class="mult" data-m="1.333333">75%</button></div><button class="go" id="go" disabled>ПРОКАЧАТЬ</button></div><div class="cardbig"><div class="weapon" id="toWeapon">?</div><div class="name" id="toName">Цель появится здесь</div><div class="price" id="toPrice">—</div></div></div></section><section id="shop" class="view hidden"><div class="panel"><h2>Магазин</h2><div class="toolbar"><input id="shopSearch" class="search" placeholder="Поиск по названию..."></div><div id="shopGrid" class="shopgrid"></div><div class="note">Первая версия RahGrade: виртуальная голда, без реальных денег и вывода.</div></div></section><section id="inventory" class="view hidden"><div class="panel"><h2>Инвентарь</h2><div class="toolbar"><input id="invSearch" class="search" placeholder="Поиск..."></div><div id="invGrid" class="shopgrid"></div></div></section><section id="history" class="view hidden"><div class="panel"><h2>История</h2><div id="historyList" class="history"></div></div></section></div>
<script>const C=[["G22","Yellow Line",4],["M4","Kitsune",2],["Desert Eagle","Ace",8],["M16","Needle",16],["Scorpion","Starfall",650],["TEC-9","Fable",18],["AKR12","Carbon",10],["M4","Lizard",36],["M4","Samurai",92],["M4","Grand Prix",58],["M4A1","K.I.N.G. v7.03",108],["M4A1","Bubblegum",74],["AKR","Treasure Hunter",850],["AKR","Necromancer",210],["AKR","Sport",98],["AKR","Carbon",14],["AKR12","Railgun",67],["AKR12","Aurora",83],["AKR12","Mechanic",48],["AWM","Dragon",740],["AWM","Sport V2",220],["AWM","Genesis",125],["AWM","Poseidon",24],["USP","Pisces",3],["USP","Chameleon",30],["P350","Neon",9],["P350","Oni",42],["MP7","Banana",22],["MP7","Graffiti",8],["UMP45","Cerberus",20],["TEC-9","Tie Dye",10],["M110","Cyber",35],["FAMAS","Handcraft",18],["G22","Flock",9],["Sticker","Kitsune",24],["Graffiti","Wanted",1],["Case","Fable",178],["Case","Scorpion",290],["Case","Syndicate Event",329]].map((x,i)=>({id:'x'+i,weapon:x[0],name:x[1],price:x[2]}));const key='rahgrade_v1';let s=JSON.parse(localStorage.getItem(key)||'null')||{balance:5000,inventory:[],history:[],nextId:1};let selected=null,mult=2;const fmt=n=>Number(n).toFixed(2).replace(/\.00$/,'');const short=x=>(x.weapon+' '+x.name).split(/\s+/).slice(0,3).join(' ').toUpperCase();function save(){localStorage.setItem(key,JSON.stringify(s));render()}function target(){if(!selected)return null;let p=selected.price*mult,a=C.slice().sort((x,y)=>Math.abs(x.price-p)-Math.abs(y.price-p));return a[0]}function chance(){return mult===1.333333?75:100/mult}function render(){bal.textContent=s.balance.toFixed(2);let q=(shopSearch.value||'').toLowerCase();shopGrid.innerHTML=C.filter(x=>(x.weapon+' '+x.name).toLowerCase().includes(q)).sort((a,b)=>a.price-b.price).map(x=>`<div class=item><div class=miniweapon>${short(x)}</div><div class=nm>${x.weapon} ${x.name}</div><div class=pr>${fmt(x.price)} G</div><div class=actions><button class="small buy" onclick="buy('${x.id}')">Купить</button></div></div>`).join('');let iq=(invSearch.value||'').toLowerCase();let inv=s.inventory.filter(x=>(x.weapon+' '+x.name).toLowerCase().includes(iq));invGrid.innerHTML=inv.length?inv.map(x=>`<div class=item><div class=miniweapon>${short(x)}</div><div class=nm>${x.weapon} ${x.name}</div><div class=pr>${fmt(x.price)} G</div><div class=actions><button class=small onclick="choose('${x.uid}')">В апгрейд</button><button class="small sell" onclick="sell('${x.uid}')">Продать</button></div></div>`).join(''):'<div class=note>Инвентарь пуст.</div>';historyList.innerHTML=s.history.slice().reverse().map(h=>`<div class=row><span>${h.time}</span><span>${h.from} → ${h.to}</span><span>${h.c}%</span><span class=${h.w?'win':'lose'}>${h.w?'WIN':'LOSE'}</span></div>`).join('');let t=target(),c=chance();ring.style.setProperty('--chance',c);document.getElementById('chance').textContent=c.toFixed(2)+'%';chanceLabel.textContent=c>=70?'ВЫСОКИЙ ШАНС':c>=35?'СРЕДНИЙ ШАНС':'НИЗКИЙ ШАНС';if(selected){fromWeapon.textContent=short(selected);fromName.textContent=selected.weapon+' '+selected.name;fromPrice.textContent=fmt(selected.price)+' G';go.disabled=false}else{fromWeapon.textContent='?';fromName.textContent='Выбери скин из инвентаря';fromPrice.textContent='—';go.disabled=true}if(t&&selected){toWeapon.textContent=short(t);toName.textContent=t.weapon+' '+t.name;toPrice.textContent=fmt(selected.price*mult)+' G'}else{toWeapon.textContent='?';toName.textContent='Цель появится здесь';toPrice.textContent='—'}}window.buy=id=>{let x=C.find(v=>v.id===id);if(s.balance<x.price)return toast('Недостаточно G');s.balance-=x.price;s.inventory.push({...x,uid:'i'+s.nextId++});save()};window.sell=uid=>{let i=s.inventory.findIndex(x=>x.uid===uid);if(i<0)return;let x=s.inventory[i];s.balance+=x.price;s.inventory.splice(i,1);if(selected?.uid===uid)selected=null;save()};window.choose=uid=>{selected=s.inventory.find(x=>x.uid===uid);show('upgrade');render()};document.querySelectorAll('.mult').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mult').forEach(x=>x.classList.remove('on'));b.classList.add('on');mult=+b.dataset.m;render()});go.onclick=()=>{if(!selected)return;let c=chance(),w=Math.random()*100<c,t=target(),i=s.inventory.findIndex(x=>x.uid===selected.uid),f=selected;s.inventory.splice(i,1);if(w){let won={...t,price:+(f.price*mult).toFixed(2),uid:'i'+s.nextId++};s.inventory.push(won);toast('WIN! '+fmt(won.price)+' G')}else toast('LOSE');s.history.push({time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),from:f.weapon+' '+f.name,to:w?(t.weapon+' '+t.name):'СЛИВ',c,w});selected=null;save()};function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===id))}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.tab));shopSearch.oninput=render;invSearch.oninput=render;function toast(x){let d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}render();</script></body></html>
