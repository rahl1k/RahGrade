<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RahGrade</title>
<style>
:root{--bg:#090b0f;--panel:#11151b;--panel2:#171c24;--line:#272e39;--txt:#f6f8fb;--muted:#8c97a8;--gold:#ffc526;--gold2:#ff9f0a;--good:#2ee58a;--bad:#ff5f67}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#2b220b 0,transparent 34%),var(--bg);color:var(--txt);font-family:Inter,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}.top{height:72px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line);background:#0b0e13e8;position:sticky;top:0;z-index:30;backdrop-filter:blur(15px)}
.logo{font-size:23px;font-weight:1000}.logo b{color:var(--gold)}.balance{margin-left:auto;background:#171b21;border:1px solid #2b323d;border-radius:16px;padding:10px 16px;font-size:18px;font-weight:1000;color:var(--gold)}
.wrap{max-width:1420px;margin:auto;padding:20px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#12161c;color:#bbc4d2;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:900}.tab.on{background:var(--gold);color:#15110a;border-color:var(--gold)}
.panel{background:linear-gradient(180deg,#151a22,#0f1319);border:1px solid var(--line);border-radius:20px;padding:18px}.upgrade{display:grid;grid-template-columns:1fr 280px 1fr;gap:18px}
.cardbig{min-height:315px;border:1px solid #313947;border-radius:18px;background:radial-gradient(circle at 50% 28%,#253049 0,transparent 58%),#121720;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden}
.weaponArt{width:230px;height:120px;display:grid;place-items:center;margin-bottom:12px}.weaponArt svg{width:100%;height:100%;filter:drop-shadow(0 10px 15px #0008)}
.name{font-weight:1000;font-size:17px}.price{margin-top:8px;color:var(--gold);font-size:25px;font-weight:1000}.mid{display:flex;flex-direction:column;align-items:center;justify-content:center}
.chanceRing{width:205px;height:205px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--chance)*1%),#2a303a 0);position:relative}.chanceRing:after{content:"";position:absolute;inset:18px;border-radius:50%;background:#11161d}
.chanceTxt{z-index:2;text-align:center}.chanceTxt strong{font-size:37px;color:var(--gold)}.chanceTxt small{display:block;margin-top:4px;color:var(--good);font-weight:1000}.mults{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.mult{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:#171c24;color:#b9c3d0;cursor:pointer;font-weight:1000}.mult.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px #ffc52633}
.go{margin-top:16px;width:220px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));padding:15px;font-weight:1000;font-size:18px;cursor:pointer;color:#181108}.go:disabled{opacity:.35;cursor:not-allowed}
.toolbar{display:flex;gap:10px;margin-bottom:14px}.search{flex:1;background:#0d1117;border:1px solid var(--line);color:white;padding:12px 14px;border-radius:12px}.shopgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-height:590px;overflow:auto;padding-right:4px}
.item{background:#131820;border:1px solid var(--line);border-radius:14px;padding:11px;transition:.15s}.item:hover{transform:translateY(-2px);border-color:#556172}.miniweapon{height:92px;border-radius:10px;background:linear-gradient(135deg,#252f3e,#151a22);display:grid;place-items:center;overflow:hidden}.miniweapon svg{width:94%;height:94%;filter:drop-shadow(0 7px 8px #0006)}
.item .nm{font-size:13px;font-weight:1000;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .pr{color:var(--gold);font-weight:1000;margin-top:5px}.actions{display:flex;gap:8px;margin-top:8px}.small{flex:1;border:1px solid var(--line);background:#1a2029;color:white;border-radius:8px;padding:7px;cursor:pointer;font-size:12px;font-weight:900}.small.buy{background:#5b4908}.small.sell{background:#352029}
.history{max-height:560px;overflow:auto}.row{display:grid;grid-template-columns:90px 1fr 85px 85px;gap:10px;padding:11px;border-bottom:1px solid var(--line);font-size:13px}.win{color:var(--good);font-weight:1000}.lose{color:var(--bad);font-weight:1000}.note{color:var(--muted);font-size:12px;margin-top:10px}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#171c24;border:1px solid var(--line);padding:14px 16px;border-radius:12px;z-index:80;box-shadow:0 12px 40px #0009}
.spinModal{position:fixed;inset:0;background:#05070bdc;z-index:70;display:grid;place-items:center;padding:20px;backdrop-filter:blur(10px)}.spinBox{width:min(1100px,96vw);background:#10151c;border:1px solid #343d4a;border-radius:22px;padding:26px;box-shadow:0 28px 90px #000b}
.spinTitle{text-align:center;font-weight:1000;font-size:22px;margin-bottom:20px}.roulette{height:190px;position:relative;overflow:hidden;border-radius:16px;border:1px solid #343d4a;background:#080c12}
.pointer{position:absolute;z-index:5;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:26px solid var(--gold);filter:drop-shadow(0 4px 8px #000);}.pointerLine{position:absolute;z-index:4;left:50%;top:0;bottom:0;width:2px;background:#ffc526aa}
.track{height:100%;display:flex;align-items:center;gap:10px;padding:0 20px;will-change:transform;transform:translateX(0)}.spinCard{flex:0 0 150px;height:145px;border-radius:13px;border:1px solid #303846;background:linear-gradient(180deg,#1b2230,#11161e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center}
.spinCard.winCard{border-color:#2ee58a;box-shadow:0 0 24px #2ee58a22}.spinCard.loseCard{border-color:#ff5f67}.spinArt{height:70px;width:130px;display:grid;place-items:center}.spinArt svg{width:100%;height:100%}.spinNm{font-size:11px;font-weight:1000;margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spinPr{font-size:13px;color:var(--gold);font-weight:1000;margin-top:3px}
.resultText{text-align:center;margin-top:18px;font-size:26px;font-weight:1000;min-height:32px}.resultText.win{color:var(--good)}.resultText.lose{color:var(--bad)}
@media(max-width:1050px){.shopgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.upgrade{grid-template-columns:1fr}.shopgrid{grid-template-columns:repeat(2,1fr)}.top{padding:0 12px}.wrap{padding:12px}.spinCard{flex-basis:130px}.roulette{height:175px}}
</style>
</head>
<body>
<div class="top"><div class="logo"><b>RAH</b>GRADE</div><div class="balance">БАЛАНС: <span id="bal">5000.00</span> G</div></div>
<div class="wrap">
<div class="tabs"><button class="tab on" data-tab="upgrade">АПГРЕЙД</button><button class="tab" data-tab="shop">МАГАЗИН</button><button class="tab" data-tab="inventory">ИНВЕНТАРЬ</button><button class="tab" data-tab="history">ИСТОРИЯ</button></div>
<section id="upgrade" class="view"><div class="panel upgrade">
<div class="cardbig"><div class="weaponArt" id="fromWeapon"></div><div class="name" id="fromName">Выбери скин из инвентаря</div><div class="price" id="fromPrice">—</div></div>
<div class="mid"><div class="chanceRing" id="ring" style="--chance:50"><div class="chanceTxt"><strong id="chance">50.00%</strong><small id="chanceLabel">ВЫСОКИЙ ШАНС</small></div></div><div class="mults"><button class="mult on" data-m="2">X2</button><button class="mult" data-m="4">X4</button><button class="mult" data-m="8">X8</button><button class="mult" data-m="1.333333">75%</button></div><button class="go" id="go" disabled>ПРОКАЧАТЬ</button></div>
<div class="cardbig"><div class="weaponArt" id="toWeapon"></div><div class="name" id="toName">Цель появится здесь</div><div class="price" id="toPrice">—</div></div>
</div></section>
<section id="shop" class="view hidden"><div class="panel"><h2>Магазин</h2><div class="toolbar"><input id="shopSearch" class="search" placeholder="Поиск по названию..."></div><div id="shopGrid" class="shopgrid"></div><div class="note">RahGrade использует виртуальную голду. Реальных денег и вывода нет.</div></div></section>
<section id="inventory" class="view hidden"><div class="panel"><h2>Инвентарь</h2><div class="toolbar"><input id="invSearch" class="search" placeholder="Поиск..."></div><div id="invGrid" class="shopgrid"></div></div></section>
<section id="history" class="view hidden"><div class="panel"><h2>История</h2><div id="historyList" class="history"></div></div></section>
</div>
<div id="spinModal" class="spinModal hidden"><div class="spinBox"><div class="spinTitle">АПГРЕЙД</div><div class="roulette"><div class="pointer"></div><div class="pointerLine"></div><div class="track" id="track"></div></div><div class="resultText" id="resultText"></div></div></div>
<script>
const RAW=[["G22","Yellow Line",4],["G22","Carbon",5],["G22","Flock",9],["G22","Nest",12],["G22","Relic",22],["G22","Frozen",31],["G22","Casual",44],["USP","Pisces",3],["USP","Digital Burst",17],["USP","Chameleon",30],["USP","Stone Cold",13],["USP","Geometric",55],["USP","Ignite",81],["P350","Neon",9],["P350","Forest Spirit",6],["P350","Radiation",27],["P350","Oni",42],["P350","Skull",67],["P350","Tag King",95],["Desert Eagle","Ace",8],["Desert Eagle","Red Dragon",20],["Desert Eagle","Predator",39],["Desert Eagle","Orochi",78],["Desert Eagle","Dragon Glass",138],["Desert Eagle","Yakuza",260],["F/S","Tactical",20],["F/S","Venom",48],["F/S","Zone",12],["F/S","Poison",77],["F/S","Demonic Fog",118],["TEC-9","Tie Dye",10],["TEC-9","Fable",18],["TEC-9","Reactor",7],["TEC-9","Tropic",14],["TEC-9","Necromancer",36],["TEC-9","Restless",64],["TEC-9","Royal Frost",105],["MP7","Graffiti",8],["MP7","Banana",22],["MP7","Arcade",32],["MP7","Blizzard",15],["MP7","Revival",52],["MP7","2 Years Red",92],["UMP45","Gas",5],["UMP45","Winged",12],["UMP45","Cerberus",20],["UMP45","Beast",41],["UMP45","Pixel V2",72],["UMP45","Spirit",112],["MP5","Dusk",6],["MP5","Project Z9",16],["MP5","Gorgon",34],["MP5","Zone",57],["MP5","Reactor",103],["P90","Radiation",17],["P90","Oops",28],["P90","Samurai",59],["P90","Ghoul",94],["P90","Dragon Flame",150],["FAMAS","Autumn",5],["FAMAS","Beagle",7],["FAMAS","Hull",13],["FAMAS","Handcraft",18],["FAMAS","Anger",32],["FAMAS","Monster",69],["M4","Kitsune",2],["M4","Lizard",36],["M4","Grand Prix",58],["M4","Samurai",92],["M4","Demon",141],["M4","Revival",205],["M4","Night Wolf",330],["M4A1","Bubblegum",74],["M4A1","K.I.N.G. v7.03",108],["M4A1","Immortal",156],["M4A1","Serpent",230],["M4A1","Paladin",390],["M16","Needle",16],["M16","Winged",38],["M16","Facet",75],["M16","Triumphant",120],["M16","Muraena",190],["M16","Shogun",310],["AKR","Carbon",14],["AKR","Sport",98],["AKR","Necromancer",210],["AKR","Treasure Hunter",850],["AKR","Dragon",420],["AKR","Evolution",155],["AKR","Fabric Storm",63],["AKR12","Carbon",10],["AKR12","Mechanic",48],["AKR12","Railgun",67],["AKR12","Aurora",83],["AKR12","Transistor",118],["AKR12","Haunt",180],["AKR12","Ashbringer",305],["M110","Transition",22],["M110","Cyber",35],["M110","Celestial Beast",28],["M110","Year of the Tiger",96],["M110","Z07 M.A.R.K.S.M.A.N.",145],["M110","Themis",260],["SM1014","Facet",8],["SM1014","Arctic",20],["SM1014","Serpent",16],["SM1014","Necromancer",31],["SM1014","Pathfinder",58],["SM1014","Tropic",89],["AWM","Poseidon",24],["AWM","Genesis",125],["AWM","Sport V2",220],["AWM","Dragon",740],["AWM","Boom",92],["AWM","Kings",360],["AWM","Treasure Hunter",920],["M40","Quake",7],["M40","Beagle",18],["M40","Monster",39],["M40","Thief of the Christmas",71],["M40","Cursed Fire",126],["Scorpion","Sea Eye",40],["Scorpion","Scratch",120],["Scorpion","Starfall",650],["Scorpion","Veil",260],["FabM","Flight",19],["FabM","Parrot",34],["FabM","Reactor",60],["FabM","BOOM",110],["Knife","Kunai Luxury",180],["Knife","Flip Vortex",260],["Knife","Tanto Pearl Abyss",330],["Knife","Butterfly Legacy",520],["Knife","Karambit Gold",780],["Knife","M9 Universe",1200],["Sticker","Kitsune",24],["Sticker","Cat Swap",48],["Sticker","Winter Fun",96],["Sticker","Akuma",30],["Sticker","Infernal Skull",75],["Sticker","Dragon",135],["Charm","Cutting Pliers",24],["Charm","Winter Games",10],["Charm","Shuriken",42],["Charm","Golden Skull",88],["Charm","Katana",155],["Graffiti","Wanted",1],["Graffiti","Camper",5],["Graffiti","Respect",12],["Graffiti","Lucky",19],["Graffiti","Fire",31],["Case","Fable",178],["Case","Scorpion",290],["Case","Empire",172],["Case","Sharp",199],["Case","Revenge",160],["Case","Nightmare Weapon",114],["Case","Kitsune Dreams Weapon",105],["Case","Prey Weapon",104],["Case","Gambit Weapon",99],["Case","Syndicate Event",329],["Case","Winter Tale Weapon",74],["Case","Breakout Weapon",85],["Case","Champions Weapon",54]];
const C=RAW.map((x,i)=>({id:'x'+i,weapon:x[0],name:x[1],price:+x[2]}));
const key='rahgrade_v1';let s=JSON.parse(localStorage.getItem(key)||'null')||{balance:5000,inventory:[],history:[],nextId:1};let selected=null,mult=2,currentTarget=null,spinning=false;
const fmt=n=>Number(n).toFixed(2).replace(/\.00$/,''); const chance=()=>mult===1.333333?75:100/mult;
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function colors(x){let h=hash(x.weapon+x.name);return [`hsl(${h%360} 78% 56%)`,`hsl(${(h*7)%360} 74% 42%)`,`hsl(${(h*13)%360} 88% 62%)`]}
function weaponSvg(x){const [a,b,c]=colors(x);const w=x.weapon.toLowerCase();let shape='';if(w.includes('knife'))shape=`<path d="M25 60 Q85 20 185 38 L225 50 Q150 66 73 76 L34 82Z"/><rect x="18" y="55" width="32" height="28" rx="8"/>`;else if(w.includes('sticker')||w.includes('graffiti'))shape=`<path d="M72 18 L168 18 L212 60 L168 102 L72 102 L28 60Z"/><circle cx="120" cy="60" r="26" fill="#1118"/>`;else if(w.includes('charm'))shape=`<circle cx="120" cy="58" r="36"/><path d="M120 10 V25 M105 10 H135" stroke-width="10" stroke-linecap="round"/>`;else if(w.includes('case'))shape=`<rect x="45" y="35" width="150" height="65" rx="10"/><path d="M88 35 V23 H152 V35" fill="none" stroke-width="10"/><rect x="110" y="58" width="20" height="18" rx="4" fill="#1118"/>`;else if(['g22','usp','p350','desert eagle','f/s','tec-9'].some(k=>w.includes(k)))shape=`<path d="M36 44 H176 L205 54 L173 65 H121 L111 88 H82 L86 64 H36Z"/><rect x="119" y="63" width="19" height="38" rx="5" transform="rotate(-12 119 63)"/>`;else if(['awm','m40','m110'].some(k=>w.includes(k)))shape=`<rect x="24" y="48" width="178" height="19" rx="6"/><rect x="90" y="35" width="60" height="11" rx="5"/><rect x="107" y="67" width="20" height="28" rx="4"/><path d="M202 48 L230 40 V76 L202 67Z"/>`;else shape=`<path d="M20 47 H173 L199 36 L228 43 V76 L199 68 L174 63 H126 L120 95 H95 L88 65 H20Z"/><rect x="107" y="62" width="25" height="42" rx="4" transform="rotate(-7 107 62)"/><rect x="49" y="65" width="18" height="31" rx="4"/>`;return `<svg viewBox="0 0 250 120" aria-label="${x.weapon} ${x.name}"><defs><linearGradient id="g${hash(x.weapon+x.name)}" x1="0" x2="1"><stop stop-color="${a}"/><stop offset=".48" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><g fill="url(#g${hash(x.weapon+x.name)})" stroke="#e9f1ff66" stroke-width="2">${shape}</g><path d="M36 52 L196 52" stroke="#fff5" stroke-width="3" stroke-dasharray="9 8"/></svg>`}
function save(){localStorage.setItem(key,JSON.stringify(s));render()}
function targetCandidates(basePrice,m){const p=basePrice*m,lo=p*.90,hi=p*1.10;let arr=C.filter(x=>x.price>=lo&&x.price<=hi&&(!selected||x.weapon!==selected.weapon||x.name!==selected.name));if(arr.length<4)arr=C.filter(x=>x.price>=p*.80&&x.price<=p*1.20&&(!selected||x.weapon!==selected.weapon||x.name!==selected.name));if(!arr.length)arr=C.slice().sort((x,y)=>Math.abs(x.price-p)-Math.abs(y.price-p)).slice(0,12);return arr}
function pickTarget(){if(!selected)return null;const arr=targetCandidates(selected.price,mult);return {...arr[Math.floor(Math.random()*arr.length)],price:+(selected.price*mult).toFixed(2)}}
function setTarget(){currentTarget=pickTarget()}
function render(){bal.textContent=s.balance.toFixed(2);let q=(shopSearch.value||'').toLowerCase();shopGrid.innerHTML=C.filter(x=>(x.weapon+' '+x.name).toLowerCase().includes(q)).sort((a,b)=>a.price-b.price).map(x=>`<div class="item"><div class="miniweapon">${weaponSvg(x)}</div><div class="nm">${x.weapon} ${x.name}</div><div class="pr">${fmt(x.price)} G</div><div class="actions"><button class="small buy" onclick="buy('${x.id}')">Купить</button></div></div>`).join('');let iq=(invSearch.value||'').toLowerCase(),inv=s.inventory.filter(x=>(x.weapon+' '+x.name).toLowerCase().includes(iq));invGrid.innerHTML=inv.length?inv.map(x=>`<div class="item"><div class="miniweapon">${weaponSvg(x)}</div><div class="nm">${x.weapon} ${x.name}</div><div class="pr">${fmt(x.price)} G</div><div class="actions"><button class="small" onclick="choose('${x.uid}')">В апгрейд</button><button class="small sell" onclick="sell('${x.uid}')">Продать</button></div></div>`).join(''):'<div class="note">Инвентарь пуст.</div>';historyList.innerHTML=s.history.slice().reverse().map(h=>`<div class="row"><span>${h.time}</span><span>${h.from} → ${h.to}</span><span>${h.c}%</span><span class="${h.w?'win':'lose'}">${h.w?'WIN':'LOSE'}</span></div>`).join('');const c=chance();ring.style.setProperty('--chance',c);document.getElementById('chance').textContent=c.toFixed(2)+'%';chanceLabel.textContent=c>=70?'ВЫСОКИЙ ШАНС':c>=35?'СРЕДНИЙ ШАНС':'НИЗКИЙ ШАНС';if(selected){fromWeapon.innerHTML=weaponSvg(selected);fromName.textContent=selected.weapon+' '+selected.name;fromPrice.textContent=fmt(selected.price)+' G';go.disabled=spinning;if(!currentTarget)setTarget()}else{fromWeapon.innerHTML='';fromName.textContent='Выбери скин из инвентаря';fromPrice.textContent='—';go.disabled=true}if(selected&&currentTarget){toWeapon.innerHTML=weaponSvg(currentTarget);toName.textContent=currentTarget.weapon+' '+currentTarget.name;toPrice.textContent=fmt(selected.price*mult)+' G'}else{toWeapon.innerHTML='';toName.textContent='Цель появится здесь';toPrice.textContent='—'}}
window.buy=id=>{let x=C.find(v=>v.id===id);if(!x)return;if(s.balance<x.price)return toast('Недостаточно G');s.balance-=x.price;s.inventory.push({...x,uid:'i'+s.nextId++});save()};window.sell=uid=>{let i=s.inventory.findIndex(x=>x.uid===uid);if(i<0)return;let x=s.inventory[i];s.balance+=x.price;s.inventory.splice(i,1);if(selected?.uid===uid){selected=null;currentTarget=null}save()};window.choose=uid=>{selected=s.inventory.find(x=>x.uid===uid)||null;currentTarget=null;setTarget();show('upgrade');render()};document.querySelectorAll('.mult').forEach(b=>b.onclick=()=>{if(spinning)return;document.querySelectorAll('.mult').forEach(x=>x.classList.remove('on'));b.classList.add('on');mult=+b.dataset.m;currentTarget=null;setTarget();render()});
function spinCardHtml(x,cls=''){return `<div class="spinCard ${cls}"><div class="spinArt">${weaponSvg(x)}</div><div class="spinNm">${x.weapon} ${x.name}</div><div class="spinPr">${fmt(x.price)} G</div></div>`}
function startSpin(finalTarget,win){spinModal.classList.remove('hidden');resultText.textContent='';resultText.className='resultText';track.style.transition='none';track.style.transform='translateX(0)';const base=selected.price,arr=[];for(let i=0;i<25;i++){let pool=targetCandidates(base,[1.333333,2,4,8][Math.floor(Math.random()*4)]);arr.push(pool[Math.floor(Math.random()*pool.length)]||C[Math.floor(Math.random()*C.length)])}const stopIndex=20;arr[stopIndex]=win?finalTarget:{weapon:'MISS',name:'Не залетело',price:0,id:'miss'};track.innerHTML=arr.map((x,i)=>x.weapon==='MISS'?`<div class="spinCard loseCard"><div class="spinArt"><svg viewBox="0 0 120 70"><path d="M25 18 L95 52 M95 18 L25 52" stroke="#ff5f67" stroke-width="10" stroke-linecap="round"/></svg></div><div class="spinNm">НЕ ЗАЛЕТЕЛО</div><div class="spinPr">0 G</div></div>`:spinCardHtml(x,i===stopIndex&&win?'winCard':'')).join('');requestAnimationFrame(()=>requestAnimationFrame(()=>{const cardW=160,view=track.parentElement.clientWidth,targetX=-(stopIndex*cardW+20+75-view/2);track.style.transition='transform 4s cubic-bezier(.08,.72,.12,1)';track.style.transform=`translateX(${targetX}px)`}));return new Promise(r=>setTimeout(r,4050))}
go.onclick=async()=>{if(!selected||spinning)return;spinning=true;render();const c=chance(),w=Math.random()*100<c,t=currentTarget||pickTarget(),i=s.inventory.findIndex(x=>x.uid===selected.uid),f=selected;if(i<0){spinning=false;return}await startSpin(t,w);s.inventory.splice(i,1);if(w){let won={...t,price:+(f.price*mult).toFixed(2),uid:'i'+s.nextId++};s.inventory.push(won);resultText.textContent='WIN! '+won.weapon+' '+won.name+' — '+fmt(won.price)+' G';resultText.className='resultText win'}else{resultText.textContent='LOSE — скин сгорел';resultText.className='resultText lose'}s.history.push({time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),from:f.weapon+' '+f.name+' ('+fmt(f.price)+'G)',to:w?(t.weapon+' '+t.name+' ('+fmt(f.price*mult)+'G)'):'СЛИВ',c,w});selected=null;currentTarget=null;spinning=false;save();setTimeout(()=>spinModal.classList.add('hidden'),1250)};
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===id))}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.tab));shopSearch.oninput=render;invSearch.oninput=render;function toast(x){let d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}render();
</script>
</body></html>
