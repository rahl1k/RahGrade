<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RahGrade</title>
<style>
:root{--bg:#0b0d11;--panel:#11151b;--line:#252c36;--txt:#f5f7fb;--muted:#8d98aa;--gold:#ffc226;--gold2:#ff9d00;--good:#2ae082;--bad:#ff5f68}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#27200d 0,transparent 34%),var(--bg);font-family:Inter,Arial,sans-serif;color:var(--txt);min-height:100vh}button,input{font:inherit}.top{height:72px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);background:#0c0f14e8;position:sticky;top:0;z-index:20;backdrop-filter:blur(16px)}.logo{font-size:22px;font-weight:1000}.logo b{color:var(--gold)}.balance{margin-left:auto;background:#171b20;border:1px solid #2a3039;border-radius:16px;padding:10px 15px;font-weight:900;color:var(--gold);font-size:18px}.wrap{max-width:1380px;margin:auto;padding:20px}.tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#12161c;color:#bac3d1;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:800}.tab.on{background:var(--gold);color:#111;border-color:var(--gold)}.panel{background:linear-gradient(180deg,#151a22,#10141a);border:1px solid var(--line);border-radius:20px;padding:18px}.upgrade{display:grid;grid-template-columns:1fr 280px 1fr;gap:18px;align-items:stretch}.cardbig{min-height:330px;border:1px solid #323a47;border-radius:18px;background:radial-gradient(circle at 50% 30%,#263147 0,transparent 55%),#131821;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.skinimg{width:88%;height:155px;object-fit:contain;filter:drop-shadow(0 12px 18px #0009);margin-bottom:12px}.skinFallback{width:88%;height:155px;border-radius:14px;background:linear-gradient(135deg,#242d3a,#11161d);display:grid;place-items:center;color:#94a1b4;font-weight:900;text-align:center;padding:18px;margin-bottom:12px}.name{font-weight:900}.price{margin-top:8px;color:var(--gold);font-size:24px;font-weight:1000}.mid{display:flex;flex-direction:column;align-items:center;justify-content:center}.dial{width:220px;height:220px;position:relative}.chanceRing{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -90deg,var(--gold) calc(var(--chance)*1%),#2b313b 0);box-shadow:0 0 28px #ffc22622}.chanceRing:after{content:"";position:absolute;inset:22px;border-radius:50%;background:#11161d}.chanceTxt{position:absolute;inset:0;z-index:2;display:grid;place-content:center;text-align:center}.chanceTxt strong{font-size:35px;color:var(--gold)}.chanceTxt small{display:block;color:var(--good);font-weight:900;margin-top:5px}.pointer{position:absolute;inset:0;z-index:5;transform:rotate(0deg);pointer-events:none}.pointer:before{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:25px solid #fff;filter:drop-shadow(0 2px 5px #000)}.pointer:after{content:"";position:absolute;left:50%;top:10px;width:6px;height:24px;transform:translateX(-50%);border-radius:6px;background:#fff;box-shadow:0 0 10px #fff8}.pointer.spinning{transition:transform 4s cubic-bezier(.08,.62,.08,1)}.go{margin-top:18px;width:215px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));padding:15px;font-weight:1000;font-size:18px;cursor:pointer}.go:disabled{opacity:.35;cursor:not-allowed}.mults{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}.mult{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:#171c24;color:#b9c2cf;cursor:pointer;font-weight:900}.mult.on{border-color:var(--gold);color:var(--gold)}.spinStatus{height:22px;margin-top:8px;font-size:13px;font-weight:900;color:#cbd3df}.toolbar{display:flex;gap:10px;margin-bottom:14px}.search{flex:1;background:#0d1117;border:1px solid var(--line);color:white;padding:12px 14px;border-radius:12px}.shopgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-height:570px;overflow:auto}.item{background:#131820;border:1px solid var(--line);border-radius:14px;padding:12px}.miniimg{width:100%;height:95px;object-fit:contain;border-radius:10px;background:#0e1319}.minifallback{height:95px;border-radius:10px;background:linear-gradient(135deg,#252e3b,#171c24);display:grid;place-items:center;text-align:center;color:#8793a5;font-size:12px;font-weight:900;padding:8px}.item .nm{font-size:13px;font-weight:900;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .pr{color:var(--gold);font-weight:1000;margin-top:5px}.actions{display:flex;gap:8px;margin-top:8px}.small{flex:1;border:1px solid var(--line);background:#1a2029;color:white;border-radius:8px;padding:7px;cursor:pointer;font-size:12px;font-weight:800}.small.buy{background:#5d4a08}.small.sell{background:#33202a}.history{max-height:520px;overflow:auto}.row{display:grid;grid-template-columns:90px 1fr 80px 80px;gap:10px;padding:11px;border-bottom:1px solid var(--line);font-size:13px}.win{color:var(--good);font-weight:900}.lose{color:var(--bad);font-weight:900}.note{color:var(--muted);font-size:12px;line-height:1.45;margin-top:10px}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#171c24;border:1px solid var(--line);padding:14px 16px;border-radius:12px;z-index:50;box-shadow:0 10px 40px #0009}@media(max-width:900px){.upgrade{grid-template-columns:1fr}.shopgrid{grid-template-columns:repeat(2,1fr)}.top{padding:0 12px}.wrap{padding:12px}}
</style></head><body>
<div class="top"><div class="logo"><b>RAH</b>GRADE</div><div class="balance">БАЛАНС: <span id="bal">5000.00</span> G</div></div>
<div class="wrap"><div class="tabs"><button class="tab on" data-tab="upgrade">АПГРЕЙД</button><button class="tab" data-tab="shop">МАГАЗИН</button><button class="tab" data-tab="inventory">ИНВЕНТАРЬ</button><button class="tab" data-tab="history">ИСТОРИЯ</button></div>
<section id="upgrade" class="view"><div class="panel upgrade"><div class="cardbig"><div id="fromVisual"></div><div class="name" id="fromName">Выбери скин из инвентаря</div><div class="price" id="fromPrice">—</div></div><div class="mid"><div class="dial"><div class="chanceRing" id="ring" style="--chance:50"></div><div class="chanceTxt"><strong id="chance">50.00%</strong><small id="chanceLabel">ВЫСОКИЙ ШАНС</small></div><div class="pointer" id="pointer"></div></div><div class="mults"><button class="mult on" data-m="2">X2</button><button class="mult" data-m="4">X4</button><button class="mult" data-m="8">X8</button><button class="mult" data-m="1.333333">75%</button></div><div class="spinStatus" id="spinStatus"></div><button class="go" id="go" disabled>ПРОКАЧАТЬ</button></div><div class="cardbig"><div id="toVisual"></div><div class="name" id="toName">Цель появится здесь</div><div class="price" id="toPrice">—</div></div></div></section>
<section id="shop" class="view hidden"><div class="panel"><h2>Магазин</h2><div class="toolbar"><input id="shopSearch" class="search" placeholder="Поиск по названию..."></div><div id="shopGrid" class="shopgrid"></div><div class="note">Цены RahGrade приведены к текущим рыночным ориентирам Standoff 2 на сентябрь 2026 и могут меняться вместе с рынком.</div></div></section>
<section id="inventory" class="view hidden"><div class="panel"><h2>Инвентарь</h2><div class="toolbar"><input id="invSearch" class="search" placeholder="Поиск..."></div><div id="invGrid" class="shopgrid"></div></div></section>
<section id="history" class="view hidden"><div class="panel"><h2>История</h2><div id="historyList" class="history"></div></div></section></div>
<script>
const IMG={
 'Karambit|Gold':'https://cosmo-chest.com/_next/image?q=100&url=https%3A%2F%2Fapi.cosmo-chest.com%2Fimages%2Fproducts%2Fimg-849f9e5e-6e9b-482b-b43c-59b2a7c252f1.webp&w=750',
 'AWM|Treasure Hunter':'https://png.klev.club/uploads/posts/2024-05/png-klev-club-t3z6-p-avm-standoff-2-png-3.png',
 'AWM|Sport V2':'https://textur.gas-kvas.com/uploads/posts/2024-10/textur-gas-kvas-com-9qgq-p-teksturi-avm-standoff-17.jpg',
 'AWM|Winter Sport':'https://cdn.payga.me/offers/2025/12/30/407867/432262/f1f2f067c4084837fce39c7fb58cf75d.image.png',
 'AWM|Dragon':'https://escorenews.com/media/news/pic-20210802-2436x1125-5648555499.jpeg',
 'AKR|Treasure Hunter':'https://cdn.payga.me/offers/2025/5/21/290761/311345/8dbebd72f65f5f479af7f2e352753a18.image.jpg',
 'M4|Necromancer':'https://images.meme-arsenal.com/08d90063b1d170c03fe52436b411b3a4.jpg',
 'G22|Frozen':'https://cdn-www.bluestacks.com/bs-images/standoff2-g22-guide-ru-16.jpg'
};
const RAW=[
['USP','Pisces',3],['G22','Yellow Line',4],['G22','Carbon',5],['FAMAS','Beagle',7],['MP7','Graffiti',8],['P350','Neon',9],['AKR12','Carbon',10],['TEC-9','Tie Dye',10],['UMP45','Winged',12],['AKR','Carbon',14],['M16','Needle',16],['TEC-9','Fable',18],['FAMAS','Handcraft',18],['UMP45','Cerberus',20],['AWM','Phoenix',21],['MP7','Banana',22],['AWM','Dragon',40],['AWM','Gear',47],['AWM','Polar Night',59],['AWM','BOOM',108],['AWM','Stickerbomb',300],['AWM','Genesis',410],['AWM','BOOM Arcane',814],['AWM','Nebula',1300],['AWM','Sport',1950],['Butterfly','Legacy',1900],['Kunai','Luxury',1250],['jKommando','Luxury',1238],['Karambit','Nebula',2900],['Karambit','Scratch',3400],['Gloves','Living Flame',3970],['M4','Necromancer',4799],['M16','Winged',4990],['M4A1','Immortal',5500],['G22','Nest',5800],['AKR12','Railgun',6100],['M9 Bayonet','Ancient',5900],['M9 Bayonet','Twilight',5800],['M9 Bayonet','Sketch',6500],['M9 Bayonet','Kumo',6700],['M9 Bayonet','Poison',6990],['AWM','Winter Sport',7240],['Karambit','Claw',7700],['AWM','2 Years Red',7900],['M9 Bayonet','Frozen',8800],['M9 Bayonet','Blue Blood',9500],['Flip','Stone Cold',10000],['AKR12','Riot',11777],['USP','Geometric',12190],['MP5','Zone',12900],['M4A1','Paladin',14900],['FAMAS','Monster',15050],['M9 Bayonet','Scratch',15400],['M9 Bayonet','Universe',16500],['Charm','Ochpochmak',19750],['P350','Radiation',26999],['M9 Bayonet','Dragon Glass',31000],['AWM','Sport V2',44444],['AKR','Digital Burst',42000],['AKR','Treasure Hunter',60000],['AWM','Winter Sport StatTrack',67500],['Dual Daggers','Harmony',71100],['AWM','Treasure Hunter',89888],['Desert Eagle','Aureate',89777],['Sting','Mimicry',105900],['Karambit','Gold',144999],['Sticker','Punisher',149997],['Flash','Solar',150000],['Sticker','Snow Queen',150000],['Sticker','Z9 Mask Color',199999],['Sticker','Metal Rat',266650],['Butterfly','Arcane Surge',344444],['Sticker','Gold Skull',399000],['Sticker','Devilish',449999],['Butterfly','Twilight',777778],['AKR12','Year of the Horse StatTrack',999998]
];
const C=RAW.map((x,i)=>({id:'x'+i,weapon:x[0],name:x[1],price:+x[2],img:IMG[x[0]+'|'+x[1]]||''}));
const key='rahgrade_v1';let s=JSON.parse(localStorage.getItem(key)||'null')||{balance:5000,inventory:[],history:[],nextId:1};if(s.nextId==null)s.nextId=1;let selected=null,mult=2,currentTarget=null,targetCache={},busy=false,currentAngle=0;
const fmt=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
function imgFor(x,cls='skinimg'){let url=x?.img||IMG[(x?.weapon||'')+'|'+(x?.name||'')]||'';return url?`<img class="${cls}" src="${url}" alt="${x.weapon} ${x.name}" onerror="this.outerHTML='<div class=skinFallback>Реальное изображение временно недоступно</div>'">`:`<div class="${cls==='miniimg'?'minifallback':'skinFallback'}">${x?x.weapon+' '+x.name:'?'}</div>`}
function save(){localStorage.setItem(key,JSON.stringify(s));renderAll()}
function targetFor(m=mult){if(!selected)return null;let k=selected.uid+'_'+m;if(targetCache[k])return targetCache[k];let desired=selected.price*m;let pool=C.filter(x=>x.weapon+'|'+x.name!==selected.weapon+'|'+selected.name).sort((a,b)=>Math.abs(a.price-desired)-Math.abs(b.price-desired));let top=pool.slice(0,Math.min(7,pool.length));let t=top[Math.floor(Math.random()*top.length)]||pool[0];targetCache[k]=t;return t}
function calcChance(){if(!selected||!currentTarget)return mult===1.333333?75:100/mult;return Math.min(95,selected.price/currentTarget.price*100)}
function refreshTarget(){currentTarget=targetFor(mult)}
function renderAll(){bal.textContent=Number(s.balance).toFixed(2);renderShop();renderInv();renderHistory();renderUpgrade()}
function renderShop(){let q=(shopSearch.value||'').toLowerCase();shopGrid.innerHTML=C.filter(x=>(x.weapon+' '+x.name).toLowerCase().includes(q)).sort((a,b)=>a.price-b.price).map(x=>`<div class=item>${imgFor(x,'miniimg')}<div class=nm>${x.weapon} ${x.name}</div><div class=pr>${fmt(x.price)} G</div><div class=actions><button class="small buy" onclick="buy('${x.id}')">Купить</button></div></div>`).join('')}
function renderInv(){let q=(invSearch.value||'').toLowerCase();let inv=s.inventory.filter(x=>(x.weapon+' '+x.name).toLowerCase().includes(q));invGrid.innerHTML=inv.length?inv.map(x=>`<div class=item>${imgFor(x,'miniimg')}<div class=nm>${x.weapon} ${x.name}</div><div class=pr>${fmt(x.price)} G</div><div class=actions><button class=small onclick="choose('${x.uid}')">В апгрейд</button><button class="small sell" onclick="sell('${x.uid}')">Продать</button></div></div>`).join(''):'<div class=note>Инвентарь пуст.</div>'}
function renderHistory(){historyList.innerHTML=s.history.slice().reverse().map(h=>`<div class=row><span>${h.time}</span><span>${h.from} → ${h.to}</span><span>${h.c}%</span><span class=${h.w?'win':'lose'}>${h.w?'WIN':'LOSE'}</span></div>`).join('')}
function renderUpgrade(){if(selected&&!currentTarget)refreshTarget();let c=calcChance();ring.style.setProperty('--chance',c);chance.textContent=c.toFixed(2)+'%';chanceLabel.textContent=c>=70?'ВЫСОКИЙ ШАНС':c>=35?'СРЕДНИЙ ШАНС':'НИЗКИЙ ШАНС';fromVisual.innerHTML=selected?imgFor(selected):'<div class=skinFallback>?</div>';fromName.textContent=selected?selected.weapon+' '+selected.name:'Выбери скин из инвентаря';fromPrice.textContent=selected?fmt(selected.price)+' G':'—';toVisual.innerHTML=currentTarget?imgFor(currentTarget):'<div class=skinFallback>?</div>';toName.textContent=currentTarget?currentTarget.weapon+' '+currentTarget.name:'Цель появится здесь';toPrice.textContent=currentTarget?fmt(currentTarget.price)+' G':'—';go.disabled=!selected||busy;document.querySelectorAll('.mult').forEach(b=>b.disabled=busy)}
window.buy=id=>{let x=C.find(v=>v.id===id);if(!x)return;if(s.balance<x.price)return toast('Недостаточно G');s.balance-=x.price;s.inventory.push({...x,uid:'i'+s.nextId++});save()};window.sell=uid=>{let i=s.inventory.findIndex(x=>x.uid===uid);if(i<0)return;let x=s.inventory[i];s.balance+=x.price;s.inventory.splice(i,1);if(selected?.uid===uid){selected=null;currentTarget=null}save()};window.choose=uid=>{selected=s.inventory.find(x=>x.uid===uid)||null;targetCache={};currentTarget=null;refreshTarget();show('upgrade');renderAll()};
document.querySelectorAll('.mult').forEach(b=>b.onclick=()=>{if(busy)return;document.querySelectorAll('.mult').forEach(x=>x.classList.remove('on'));b.classList.add('on');mult=+b.dataset.m;currentTarget=null;refreshTarget();renderUpgrade()});
go.onclick=()=>{if(!selected||!currentTarget||busy)return;busy=true;renderUpgrade();let c=calcChance();let roll=Math.random()*100;let win=roll<c;let finalDeg;if(win){finalDeg=Math.random()*(c/100*360-8)+4}else{let start=c/100*360+4;finalDeg=start+Math.random()*(356-start)}let spins=5+Math.floor(Math.random()*3);let targetAngle=currentAngle+spins*360+((finalDeg-currentAngle)%360+360)%360;pointer.classList.remove('spinning');void pointer.offsetWidth;pointer.classList.add('spinning');pointer.style.transform=`rotate(${targetAngle}deg)`;spinStatus.textContent='КРУТИМ...';go.textContent='ПРОКРУТКА';setTimeout(()=>finishSpin(win,c,currentTarget,targetAngle),4000)};
function finishSpin(win,c,t,targetAngle){currentAngle=targetAngle%360;pointer.classList.remove('spinning');pointer.style.transform=`rotate(${currentAngle}deg)`;let i=s.inventory.findIndex(x=>x.uid===selected.uid);if(i<0){busy=false;renderAll();return}let f=selected;s.inventory.splice(i,1);if(win){let won={...t,uid:'i'+s.nextId++};s.inventory.push(won);spinStatus.textContent='WIN!';toast('WIN! '+t.weapon+' '+t.name+' — '+fmt(t.price)+' G')}else{spinStatus.textContent='LOSE';toast('LOSE')};s.history.push({time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),from:f.weapon+' '+f.name,to:win?(t.weapon+' '+t.name):'СЛИВ',c:+c.toFixed(2),w:win});selected=null;currentTarget=null;targetCache={};busy=false;go.textContent='ПРОКАЧАТЬ';save()}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===id))}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.tab));shopSearch.oninput=renderShop;invSearch.oninput=renderInv;function toast(x){let d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}renderAll();
</script></body></html>
